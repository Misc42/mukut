name: Deploy to GitHub Pages

# Static site (index.html + privacy.html + viewer/ + rider/ + data/ + assets/).
# Served via GitHub Actions rather than the legacy branch build, which was
# prone to getting stuck in "building". .nojekyll is carried through so
# underscore paths (e.g. assets/_demo) publish unmangled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (whole repo minus VCS/CI)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
